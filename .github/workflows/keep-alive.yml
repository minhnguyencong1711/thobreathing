name: Keep Backend Alive

on:
  schedule:
    # Chạy mỗi 10 phút để giữ backend Render luôn hoạt động (không bị sleep)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Check
        run: |
          if [ -n "${{ secrets.BACKEND_URL }}" ]; then
            echo "Đang gửi ping đến ${{ secrets.BACKEND_URL }}/api/health..."
            curl -s -f "${{ secrets.BACKEND_URL }}/api/health" || echo "Ping hoàn tất."
          else
            echo "Chưa cấu hình secret BACKEND_URL trong Settings > Secrets and variables > Actions. Bỏ qua bước ping."
          fi
